skill:
  summary: Operate Stripe safely through the pinned outfit-managed Stripe CLI and selected account.
  guidance:
    - Start with account_get before consequential work so account and environment are explicit.
    - Prefer restricted keys and test-mode resources for development.
    - Use outfit run for curated reads, outfit write for curated mutations, and outfit exec only when the curated surface lacks a command.
    - Reads default to test mode. For a live object (an ID from production, or a dashboard link without /test/), add --live to the typed read, for example `outfit stripe subscriptions-get --subscription-id sub_123 --live`; it uses the connection's live key and needs no --write. A resource_missing error in test mode often means the object exists only in live mode.
    - Raw reads also run without --write, with or without --live, for example `outfit exec stripe -- get /v1/subscriptions/sub_123 --live` or `outfit exec stripe -- subscriptions retrieve sub_123 --live`. post, delete, create, update, cancel, -d/--data, trigger, and listen still need explicit human intent and --write.
    - A Stripe error object is a failed call (ok false, meta.status, error.provider_code such as resource_missing), never data.
  workflows:
    - title: Investigate a payment
      steps: [retrieve the payment intent, inspect its status and latest charge, report exact IDs and timestamps]
    - title: Investigate a subscription or invoice
      steps: [find the customer, inspect subscriptions and invoices, distinguish Stripe state from application assumptions]
    - title: Debug a webhook
      steps: [read the event and endpoint, inspect logs, start a listener only for interactive debugging, resend only after explicit intent]
    - title: Develop in test mode
      steps: [confirm the connection is Test, trigger an explicit fixture event, explain every generated object, avoid live resources]
    - title: Refund with confirmation
      steps: [retrieve the payment intent, state the amount and environment, obtain explicit human intent, create the refund]
skillSources:
  - id: stripe-authored
    kind: authored
    paths:
      - path: generated
