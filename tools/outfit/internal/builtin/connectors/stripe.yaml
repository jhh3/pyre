apiVersion: outfit.jhh3.dev/connector/v1alpha2
key: stripe
display: Stripe
version: 2.1.0
description: Payments, customers, subscriptions, logs, fixtures, and webhook development through a pinned Stripe CLI.
category: customer-systems
aliases: [stripe-cli, billing, payments]
useCases: [inspect payments, manage customers, investigate billing, tail logs, test webhooks]
limitations:
  - Restricted keys can expose only the resources their Stripe permissions allow.
  - Raw CLI commands that may mutate state require outfit exec --write; get, retrieve, list, and search reads do not.
  - Live-mode reads (--live) need native Stripe login or a stored live key (STRIPE_LIVE_API_KEY); mutations stay CLI-only with --write in both modes.
tools:
  - id: stripe-cli
    display: Stripe CLI
    binary: stripe
    version: 1.50.4
    source:
      kind: github-release
      repository: stripe/stripe-cli
      tag: v{{version}}
      binaryPath: stripe
      assets:
        darwin-amd64: stripe_1.50.4_mac-os_x86_64.tar.gz
        darwin-arm64: stripe_1.50.4_mac-os_arm64.tar.gz
        linux-amd64: stripe_1.50.4_linux_x86_64.tar.gz
        linux-arm64: stripe_1.50.4_linux_arm64.tar.gz
        windows-amd64: stripe_1.50.4_windows_x86_64.zip
      checksums:
        darwin-amd64: 30f85c4988d1e5d42a65d97a87265e6e4865fbf01083e6b3d1d90d2994446622
        darwin-arm64: 5dbf4bc580c3870d3f7cd0c56fde3c8a210340b59d45050a0c9c0ceb2110dc2f
        linux-amd64: f6a04bbb318e678c20bb62f1ceb2bb6b03b47173189e08e043f7a6b4d9916bc2
        linux-arm64: 35ff9ba4f861a10a94e1dff074b06b5fb36b0b3848caeeace995317de0f03f6e
        windows-amd64: 69a7fbefa337e2a896d59540a7cf252ebca939eaf6f66abb011e8e929592e67a
    verify: [version]
credentialMethods:
  - id: managed-restricted-key
    label: outfit-managed restricted API key
    description: Store a restricted Stripe key in the OS keychain and inject it only into the selected Stripe executor.
    recommended: true
    custody: outfit
    fields:
      - key: STRIPE_API_KEY
        label: Restricted API key
        description: 'Start in test mode at https://dashboard.stripe.com/test/apikeys. Under Restricted keys, create an rk_test_ key and grant only the resources this connection needs; use native Stripe login instead if you prefer Stripe to create and rotate its own 90-day restricted CLI key.'
        secret: true
        environment: [STRIPE_API_KEY]
        pattern: '(rk|sk)_(test|live)_[A-Za-z0-9_]+'
      - key: STRIPE_LIVE_API_KEY
        label: Live restricted API key
        description: 'Optional. A live-mode rk_live_ key (prefer read-only permissions) used only by reads run with --live; without it, --live fails instead of reading test data. Create one at https://dashboard.stripe.com/apikeys and store it with STRIPE_LIVE_API_KEY set in the environment of `outfit connector add` or `outfit credential replace`.'
        secret: true
        optional: true
        environment: [STRIPE_LIVE_API_KEY]
        pattern: '(rk|sk)_live_[A-Za-z0-9_]+'
    bindings:
      - target: process-env
        name: STRIPE_API_KEY
        value: '{{secret.STRIPE_API_KEY}}'
        unlessArgument: live
      - target: process-env
        name: STRIPE_API_KEY
        value: '{{secret.STRIPE_LIVE_API_KEY}}'
        whenArgument: live
  - id: native-login
    label: Existing Stripe CLI login
    description: Let Stripe CLI retain and select its own native profile; outfit stores no Stripe secret.
    custody: executor
    setup:
      program: stripe
      args: [login]
      browserContinuation: {urlField: browser_url, verificationCodeField: verification_code, nextStepField: next_step, timeoutSeconds: 300}
    verify: {program: stripe, args: [whoami, --format, json]}
    logout: {program: stripe, args: [logout]}
modes:
  - id: cli
    label: Stripe CLI
    description: Pinned native Stripe CLI with structured output, request commands, logs, fixtures, and webhook streams.
    recommendation:
      rank: 1
      reason: The official CLI has the broadest useful Stripe surface and supports both human and agent workflows.
    executor:
      kind: cli
      tool: stripe-cli
      # The CLI prints Stripe's error object and exits 0; the status is the
      # one Stripe documents for that error code or type.
      errorField: error
      errorStatus: {resource_missing: 404, invalid_request_error: 400, idempotency_error: 400, authentication_error: 401, card_error: 402, permission_error: 403, rate_limit_error: 429, rate_limit: 429, api_error: 500}
    credentialMethods: [managed-restricted-key, native-login]
    defaultCredentialMethod: managed-restricted-key
    capabilities: [customers, payments, subscriptions, refunds, balance, events, logs, webhooks]
    operations:
      - name: account_get
        title: Get Stripe account
        description: Return the Stripe account visible to the selected credential.
        class: read
        input: {type: object, properties: {live: &live {type: boolean, description: 'Read live-mode data with the connection''s live credential instead of its default (test) key. Native Stripe login uses its live key; a managed key needs STRIPE_LIVE_API_KEY stored on the connection.'}}}
        cli: {args: [get, /v1/account], optionalArgs: [{flag: --live, argument: live, boolean: true}]}
      - name: balance_get
        title: Get Stripe balance
        description: Inspect available and pending balances for the selected account.
        class: read
        input: {type: object, properties: {live: *live}}
        cli: {args: [balance, retrieve], optionalArgs: [{flag: --live, argument: live, boolean: true}]}
      - name: balance_transactions_list
        title: List balance transactions
        description: List money movements in the selected account.
        class: read
        input: {type: object, properties: {live: *live}}
        cli:
          args: [balance_transactions, list]
          optionalArgs: [{flag: --limit, argument: limit}, {flag: --type, argument: type}, {flag: --starting-after, argument: starting_after}, {flag: --live, argument: live, boolean: true}]
        pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}
      - name: customers_list
        title: List customers
        description: List customers visible to the selected Stripe account.
        class: read
        input: {type: object, properties: {live: *live}}
        cli:
          args: [customers, list]
          optionalArgs:
            - {flag: --limit, argument: limit}
            - {flag: --starting-after, argument: starting_after}
            - {flag: --live, argument: live, boolean: true}
        pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}
      - name: customers_get
        title: Retrieve customer
        description: Retrieve one Stripe customer by ID.
        class: read
        input: {type: object, properties: {live: *live, customer_id: {type: string}}, required: [customer_id], additionalProperties: false}
        cli: {args: [customers, retrieve, '{{arg.customer_id}}'], optionalArgs: [{flag: --live, argument: live, boolean: true}]}
      - name: customers_search
        title: Search customers
        description: Search customers with Stripe Search syntax.
        class: read
        input: {type: object, properties: {live: *live, query: {type: string}, limit: {type: integer}}, required: [query], additionalProperties: false}
        cli:
          args: [customers, search, --query, '{{arg.query}}']
          optionalArgs: [{flag: --limit, argument: limit}, {flag: --live, argument: live, boolean: true}]
      - name: customers_create
        title: Create customer
        description: Create a customer with explicit contact and description fields.
        class: write
        input: {type: object, properties: {email: {type: string}, name: {type: string}, description: {type: string}}, additionalProperties: false}
        cli:
          args: [customers, create]
          optionalArgs: [{flag: --email, argument: email}, {flag: --name, argument: name}, {flag: --description, argument: description}]
      - name: customers_update
        title: Update customer
        description: Update explicit fields on one customer.
        class: write
        input: {type: object, properties: {customer_id: {type: string}, email: {type: string}, name: {type: string}, description: {type: string}}, required: [customer_id], additionalProperties: false}
        cli:
          args: [customers, update, '{{arg.customer_id}}']
          optionalArgs: [{flag: --email, argument: email}, {flag: --name, argument: name}, {flag: --description, argument: description}]
      - name: customers_delete
        title: Delete customer
        description: Permanently delete one customer.
        class: destructive
        input: {type: object, properties: {customer_id: {type: string}}, required: [customer_id], additionalProperties: false}
        cli: {args: [customers, delete, '{{arg.customer_id}}', --confirm]}
      - name: payment_intents_list
        title: List payment intents
        description: List recent payment intents.
        class: read
        input: {type: object, properties: {live: *live}}
        cli:
          args: [payment_intents, list]
          optionalArgs:
            - {flag: --limit, argument: limit}
            - {flag: --starting-after, argument: starting_after}
            - {flag: --live, argument: live, boolean: true}
        pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}
      - name: payment_intents_get
        title: Retrieve payment intent
        description: Retrieve one payment intent by ID.
        class: read
        input: {type: object, properties: {live: *live, payment_intent_id: {type: string}}, required: [payment_intent_id], additionalProperties: false}
        cli: {args: [payment_intents, retrieve, '{{arg.payment_intent_id}}'], optionalArgs: [{flag: --live, argument: live, boolean: true}]}
      - name: subscriptions_list
        title: List subscriptions
        description: List subscriptions in the selected account.
        class: read
        input: {type: object, properties: {live: *live}}
        cli:
          args: [subscriptions, list]
          optionalArgs:
            - {flag: --limit, argument: limit}
            - {flag: --starting-after, argument: starting_after}
            - {flag: --live, argument: live, boolean: true}
        pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}
      - name: subscriptions_get
        title: Retrieve subscription
        description: Retrieve one subscription by ID.
        class: read
        input: {type: object, properties: {live: *live, subscription_id: {type: string}}, required: [subscription_id], additionalProperties: false}
        cli: {args: [subscriptions, retrieve, '{{arg.subscription_id}}'], optionalArgs: [{flag: --live, argument: live, boolean: true}]}
      - name: subscriptions_create
        title: Create subscription
        description: Create a subscription for a customer using explicit Stripe request data.
        class: write
        input: {type: object, properties: {customer: {type: string}, currency: {type: string}, description: {type: string}}, required: [customer, currency], additionalProperties: false}
        cli:
          args: [subscriptions, create, --customer, '{{arg.customer}}', --currency, '{{arg.currency}}']
          optionalArgs: [{flag: --description, argument: description}]
      - name: subscriptions_update
        title: Update subscription
        description: Update bounded subscription fields.
        class: write
        input: {type: object, properties: {subscription_id: {type: string}, description: {type: string}, cancel_at_period_end: {type: boolean}}, required: [subscription_id], additionalProperties: false}
        cli:
          args: [subscriptions, update, '{{arg.subscription_id}}']
          optionalArgs: [{flag: --description, argument: description}, {flag: --cancel-at-period-end, argument: cancel_at_period_end}]
      - name: subscriptions_cancel
        title: Cancel subscription
        description: Cancel one subscription immediately.
        class: destructive
        input: {type: object, properties: {subscription_id: {type: string}}, required: [subscription_id], additionalProperties: false}
        cli: {args: [subscriptions, cancel, '{{arg.subscription_id}}', --confirm]}
      - name: invoices_list
        title: List invoices
        description: List invoices in the selected account.
        class: read
        input: {type: object, properties: {live: *live}}
        cli:
          args: [invoices, list]
          optionalArgs: [{flag: --limit, argument: limit}, {flag: --customer, argument: customer}, {flag: --status, argument: status}, {flag: --starting-after, argument: starting_after}, {flag: --live, argument: live, boolean: true}]
        pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}
      - name: invoices_get
        title: Retrieve invoice
        description: Retrieve one invoice by ID.
        class: read
        input: {type: object, properties: {live: *live, invoice_id: {type: string}}, required: [invoice_id], additionalProperties: false}
        cli: {args: [invoices, retrieve, '{{arg.invoice_id}}'], optionalArgs: [{flag: --live, argument: live, boolean: true}]}
      - name: invoices_upcoming
        title: Preview upcoming invoice
        description: Preview the next invoice for a customer or subscription without creating it.
        class: read
        input: {type: object, properties: {live: *live, customer: {type: string}, subscription: {type: string}}, additionalProperties: false}
        cli:
          args: [invoices, create_preview]
          optionalArgs: [{flag: --customer, argument: customer}, {flag: --subscription, argument: subscription}, {flag: --live, argument: live, boolean: true}]
      - name: invoices_create
        title: Create invoice
        description: Create a draft invoice for a customer.
        class: write
        input: {type: object, properties: {customer: {type: string}, description: {type: string}}, required: [customer], additionalProperties: false}
        cli:
          args: [invoices, create, --customer, '{{arg.customer}}']
          optionalArgs: [{flag: --description, argument: description}]
      - name: invoices_finalize
        title: Finalize invoice
        description: Finalize a draft invoice.
        class: write
        input: {type: object, properties: {invoice_id: {type: string}}, required: [invoice_id], additionalProperties: false}
        cli: {args: [invoices, finalize_invoice, '{{arg.invoice_id}}', --confirm]}
      - name: invoices_void
        title: Void invoice
        description: Permanently void an invoice.
        class: destructive
        input: {type: object, properties: {invoice_id: {type: string}}, required: [invoice_id], additionalProperties: false}
        cli: {args: [invoices, void_invoice, '{{arg.invoice_id}}', --confirm]}
      - name: charges_list
        title: List charges
        description: List charges in the selected account.
        class: read
        input: {type: object, properties: {live: *live}}
        cli:
          args: [charges, list]
          optionalArgs: [{flag: --limit, argument: limit}, {flag: --customer, argument: customer}, {flag: --payment-intent, argument: payment_intent}, {flag: --starting-after, argument: starting_after}, {flag: --live, argument: live, boolean: true}]
        pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}
      - name: charges_get
        title: Retrieve charge
        description: Retrieve one charge by ID.
        class: read
        input: {type: object, properties: {live: *live, charge_id: {type: string}}, required: [charge_id], additionalProperties: false}
        cli: {args: [charges, retrieve, '{{arg.charge_id}}'], optionalArgs: [{flag: --live, argument: live, boolean: true}]}
      - name: refunds_list
        title: List refunds
        description: List refunds, optionally for one charge or payment intent.
        class: read
        input: {type: object, properties: {live: *live}}
        cli:
          args: [refunds, list]
          optionalArgs: [{flag: --limit, argument: limit}, {flag: --charge, argument: charge}, {flag: --payment-intent, argument: payment_intent}, {flag: --starting-after, argument: starting_after}, {flag: --live, argument: live, boolean: true}]
        pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}
      - name: refunds_get
        title: Retrieve refund
        description: Retrieve one refund by ID.
        class: read
        input: {type: object, properties: {live: *live, refund_id: {type: string}}, required: [refund_id], additionalProperties: false}
        cli: {args: [refunds, retrieve, '{{arg.refund_id}}'], optionalArgs: [{flag: --live, argument: live, boolean: true}]}
      - name: refunds_create
        title: Create refund
        description: Create a refund for a charge or payment intent.
        class: write
        input: {type: object, properties: {payment_intent_id: {type: string}, charge_id: {type: string}, amount: {type: integer}}, additionalProperties: false}
        cli:
          args: [refunds, create]
          optionalArgs: [{flag: --payment-intent, argument: payment_intent_id}, {flag: --charge, argument: charge_id}, {flag: --amount, argument: amount}]
      - name: events_list
        title: List events
        description: List recent Stripe events.
        class: read
        input: {type: object, properties: {live: *live}}
        capabilities: [events]
        cli:
          args: [events, list]
          optionalArgs: [{flag: --limit, argument: limit}, {flag: --type, argument: type}, {flag: --starting-after, argument: starting_after}, {flag: --live, argument: live, boolean: true}]
        pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}
      - name: events_get
        title: Retrieve event
        description: Retrieve one Stripe event by ID.
        class: read
        capabilities: [events]
        input: {type: object, properties: {live: *live, event_id: {type: string}}, required: [event_id], additionalProperties: false}
        cli: {args: [events, retrieve, '{{arg.event_id}}'], optionalArgs: [{flag: --live, argument: live, boolean: true}]}
      - name: events_resend
        title: Resend event
        description: Resend one event to an explicit webhook endpoint.
        class: write
        capabilities: [events, webhooks]
        input: {type: object, properties: {event_id: {type: string}, webhook_endpoint_id: {type: string}}, required: [event_id, webhook_endpoint_id], additionalProperties: false}
        cli: {args: [events, resend, '{{arg.event_id}}', --webhook-endpoint, '{{arg.webhook_endpoint_id}}', --confirm]}
      - name: webhook_endpoints_list
        title: List webhook endpoints
        description: List registered webhook endpoints.
        class: read
        input: {type: object, properties: {live: *live}}
        capabilities: [webhooks]
        cli:
          args: [webhook_endpoints, list]
          optionalArgs: [{flag: --limit, argument: limit}, {flag: --starting-after, argument: starting_after}, {flag: --live, argument: live, boolean: true}]
        pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}
      - name: webhook_endpoints_get
        title: Retrieve webhook endpoint
        description: Retrieve one webhook endpoint by ID.
        class: read
        capabilities: [webhooks]
        input: {type: object, properties: {live: *live, webhook_endpoint_id: {type: string}}, required: [webhook_endpoint_id], additionalProperties: false}
        cli: {args: [webhook_endpoints, retrieve, '{{arg.webhook_endpoint_id}}'], optionalArgs: [{flag: --live, argument: live, boolean: true}]}
      - name: event_trigger
        title: Trigger test event
        description: Create test fixtures and trigger one Stripe event type.
        class: write
        capabilities: [events]
        input: {type: object, properties: {event_type: {type: string}}, required: [event_type], additionalProperties: false}
        cli: {args: [trigger, '{{arg.event_type}}']}
      - name: logs_tail
        title: Tail request logs
        description: Stream Stripe API request logs until cancelled.
        class: read
        interaction: stream
        cli: {args: [logs, tail]}
      - name: webhook_listen
        title: Forward webhook events
        description: Listen for Stripe webhook events and optionally forward them locally.
        class: read
        interaction: stream
        capabilities: [webhooks]
        cli:
          args: [listen]
          optionalArgs:
            - {flag: --forward-to, argument: forward_to}
    verify: account_get
  - id: rest
    label: Stripe REST API
    description: Read-only fixed-origin Stripe API access using the same outfit-managed key without a provider CLI process.
    recommendation:
      rank: 2
      reason: Choose REST for a minimal read-only surface; Stripe CLI remains the broader recommended experience.
    executor: {kind: http, baseUrl: 'https://api.stripe.com/v1/'}
    credentialMethods: [managed-restricted-key]
    defaultCredentialMethod: managed-restricted-key
    credentialBindings:
      managed-restricted-key:
        - {target: http-header, name: Authorization, value: 'Bearer {{secret.STRIPE_API_KEY}}', unlessArgument: live}
        - {target: http-header, name: Authorization, value: 'Bearer {{secret.STRIPE_LIVE_API_KEY}}', whenArgument: live}
    capabilities: [customers, payments, subscriptions, refunds, balance, events, webhooks]
    operations:
      - {name: account_get, title: Get Stripe account, description: Return the Stripe account visible to the selected credential., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: account}}
      - {name: balance_get, title: Get Stripe balance, description: Inspect available and pending balances., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: balance}}
      - {name: balance_transactions_list, title: List balance transactions, description: List money movements., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: balance_transactions, query: [limit, type, starting_after]}, pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}}
      - {name: customers_list, title: List customers, description: List customers., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: customers, query: [limit, starting_after]}, pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}}
      - {name: customers_get, title: Retrieve customer, description: Retrieve one customer., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: 'customers/{{arg.customer_id}}'}}
      - {name: customers_search, title: Search customers, description: Search customers., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: customers/search, query: [query, limit]}}
      - {name: subscriptions_list, title: List subscriptions, description: List subscriptions., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: subscriptions, query: [limit, customer, status, starting_after]}, pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}}
      - {name: subscriptions_get, title: Retrieve subscription, description: Retrieve one subscription., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: 'subscriptions/{{arg.subscription_id}}'}}
      - {name: invoices_list, title: List invoices, description: List invoices., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: invoices, query: [limit, customer, status, starting_after]}, pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}}
      - {name: invoices_get, title: Retrieve invoice, description: Retrieve one invoice., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: 'invoices/{{arg.invoice_id}}'}}
      - {name: payment_intents_list, title: List payment intents, description: List payment intents., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: payment_intents, query: [limit, customer, starting_after]}, pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}}
      - {name: payment_intents_get, title: Retrieve payment intent, description: Retrieve one payment intent., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: 'payment_intents/{{arg.payment_intent_id}}'}}
      - {name: charges_list, title: List charges, description: List charges., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: charges, query: [limit, customer, payment_intent, starting_after]}, pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}}
      - {name: charges_get, title: Retrieve charge, description: Retrieve one charge., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: 'charges/{{arg.charge_id}}'}}
      - {name: refunds_list, title: List refunds, description: List refunds., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: refunds, query: [limit, charge, payment_intent, starting_after]}, pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}}
      - {name: refunds_get, title: Retrieve refund, description: Retrieve one refund., class: read, input: {type: object, properties: {live: *live}}, http: {method: GET, path: 'refunds/{{arg.refund_id}}'}}
      - {name: events_list, title: List events, description: List events., class: read, input: {type: object, properties: {live: *live}}, capabilities: [events], http: {method: GET, path: events, query: [limit, type, starting_after]}, pagination: {cursorArgument: starting_after, itemsPath: $.data, hasMorePath: $.has_more, cursorFromLastItemPath: $.id, defaultMaxPages: 10, defaultMaxItems: 1000}}
