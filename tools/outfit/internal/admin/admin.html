<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>outfit · local connectors</title>
<style>
:root{color-scheme:light dark;--bg:#f4f1ea;--panel:#fffdf8;--ink:#172018;--muted:#667166;--line:#d8d8cd;--accent:#176b4d;--bad:#a63f36}@media(prefers-color-scheme:dark){:root{--bg:#101411;--panel:#171d18;--ink:#edf2ec;--muted:#9aa79c;--line:#344038;--accent:#66d4a7;--bad:#ff8b7f}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui}main{max-width:1120px;margin:0 auto;padding:48px 24px 80px}h1{font-size:38px;letter-spacing:-.04em;margin:0}header p{color:var(--muted);max-width:680px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:28px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.eyebrow{font:12px ui-monospace,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.status{font-size:12px;padding:4px 9px;border-radius:99px;border:1px solid var(--line)}.status.on{color:var(--accent)}h2{font-size:20px;margin:6px 0}p{margin:6px 0}.muted{color:var(--muted)}select,input{width:100%;margin-top:8px;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink)}label{display:block;margin-top:12px;font-size:13px}.actions{display:flex;gap:8px;margin-top:16px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:650;cursor:pointer;background:var(--accent);color:white}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.danger{color:var(--bad)}.notice{position:fixed;right:20px;bottom:20px;padding:12px 16px;border-radius:10px;background:var(--ink);color:var(--bg);opacity:0;transform:translateY(10px);transition:.2s}.notice.show{opacity:1;transform:none}.mode-description{min-height:42px}
</style></head><body><main><header><div class="eyebrow">Entirely local · secrets stay in your OS keychain</div><h1>Connector workbench</h1><p>Each named connection has exactly one active mode. Changing a mode verifies its credential before switching; the old secret is destroyed only after the new mode is live.</p></header><div id="grid" class="grid"></div></main><div id="notice" class="notice"></div>
<script>
const nonce={{.Nonce}},headers={'Content-Type':'application/json','X-Outfit-Admin':nonce};let snapshot;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(text){const n=document.querySelector('#notice');n.textContent=text;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),3500)}
async function api(path,options={}){const response=await fetch(path,{...options,headers:{...headers,...options.headers}}),data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');return data}
function connectionFor(key){return snapshot.connections.find(c=>c.ConnectorKey===key&&c.Status!=='removed')}
function modeFields(pkg,mode,connection){return mode.auth.fields.map(f=>`<label>${esc(f.label)}${f.optional?' <span class=muted>optional</span>':''}<input data-field="${esc(f.key)}" type="${f.secret?'password':'text'}" autocomplete="off" placeholder="${connection&&f.secret?'Enter a replacement value':esc(f.placeholder||'')}"></label>`).join('')}
function card(pkg){const c=connectionFor(pkg.Key),selected=c?.SelectedMode||pkg.Package.modes.find(m=>m.recommended)?.id||pkg.Package.modes[0].id,mode=pkg.Package.modes.find(m=>m.id===selected);return `<section class=card data-key="${esc(pkg.Key)}"><div class=row><div><div class=eyebrow>${esc(pkg.Package.category||'Connector')}</div><h2>${esc(pkg.Package.display)}</h2></div><span class="status ${c?.Status==='active'?'on':''}">${c?.Status==='active'?'Connected · '+esc(c.SelectedMode):'Not connected'}</span></div><p class=muted>${esc(pkg.Package.description)}</p><label>Connection name<input data-name value="${esc(c?.Name||pkg.Key)}"></label><label>Use one mode<select data-mode>${pkg.Package.modes.map(m=>`<option value="${esc(m.id)}" ${m.id===selected?'selected':''}>${esc(m.label)}${m.recommended?' · Recommended':''}</option>`).join('')}</select></label><p class="muted mode-description">${esc(mode.description)}</p><div data-fields>${modeFields(pkg.Package,mode,c)}</div><div class=actions><button data-save>${c?'Verify & replace':'Verify & connect'}</button>${c?'<button class="ghost danger" data-remove>Remove</button>':''}</div></section>`}
function render(){document.querySelector('#grid').innerHTML=snapshot.packages.map(card).join('');document.querySelectorAll('[data-mode]').forEach(select=>select.onchange=()=>{const card=select.closest('.card'),pkg=snapshot.packages.find(p=>p.Key===card.dataset.key).Package,mode=pkg.modes.find(m=>m.id===select.value),c=connectionFor(pkg.key);card.querySelector('.mode-description').textContent=mode.description;card.querySelector('[data-fields]').innerHTML=modeFields(pkg,mode,c)});document.querySelectorAll('[data-save]').forEach(button=>button.onclick=save);document.querySelectorAll('[data-remove]').forEach(button=>button.onclick=remove)}
async function save(event){const card=event.target.closest('.card'),fields={};card.querySelectorAll('[data-field]').forEach(i=>fields[i.dataset.field]=i.value);event.target.disabled=true;try{await api('/api/connections',{method:'POST',body:JSON.stringify({connector:card.dataset.key,name:card.querySelector('[data-name]').value,mode:card.querySelector('[data-mode]').value,fields})});notify('Verified and connected');await load()}catch(error){notify(error.message)}finally{event.target.disabled=false}}
async function remove(event){const card=event.target.closest('.card'),c=connectionFor(card.dataset.key);if(!confirm(`Remove ${c.Name} and destroy its local secret?`))return;try{await api('/api/connections/'+encodeURIComponent(c.Name)+'/remove',{method:'POST'});notify('Connection removed');await load()}catch(error){notify(error.message)}}
async function load(){snapshot=await api('/api/snapshot');render()}load().catch(e=>notify(e.message));
</script></body></html>
